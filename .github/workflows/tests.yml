name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: fake          # tests never call a real model
      RETRIEVAL_MODE: hybrid      # skip the re-ranker download in CI
      MODEL_CACHE: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The embedding model (~470 MB) is downloaded once, then restored from cache
      - uses: actions/cache@v4
        with:
          path: models
          key: hf-${{ hashFiles('core/config.py') }}

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Retrieval evaluation
        run: |
          python eval/run_eval.py
          python eval/benchmark.py --modes vector keyword hybrid
